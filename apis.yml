name: Paperplane
description: >-
  Paperplane is an AI sales-productivity tool (Y Combinator W23, backed by
  Bloomberg Beta) that automatically takes notes on sales calls and keeps a
  rep's CRM up to date. It connects to a team's calendar and to conversational
  intelligence and call-recording tools such as Gong and Chorus, transcribes and
  analyzes each call, then writes the results back to Salesforce — updating
  opportunity fields, notes, and action items so sales teams spend less time on
  manual CRM data entry and stay on top of their deals. The product is organized
  around opportunities, calls, and notes, with integrations for Google Calendar,
  Gong, Chorus, and Salesforce. Paperplane appears to have wound down: Y
  Combinator lists the company as Inactive (and now describes it as a credit
  risk management platform for builders' merchants, so it pivoted at least once
  before stopping), its marketing site presents no TLS certificate, its
  application host returns a Vercel 402 DEPLOYMENT_DISABLED, and its API host is
  an Envoy ingress that 404s every path with an empty body. Two surfaces remain
  live: a GitBook documentation site — which is an unfilled starter template
  carrying GitBook's own placeholder copy, last updated three years ago — with
  an llms.txt index, and a Clerk-hosted OpenID Connect identity instance at
  clerk.paperplane.ai that still serves real OIDC and RFC 8414 discovery
  documents. There is no public developer API, OpenAPI definition, SDK, MCP
  server, or agent card.
