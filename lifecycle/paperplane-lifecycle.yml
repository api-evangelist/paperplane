    against both LibreSSL and OpenSSL. Plain HTTP 301s to the HTTPS URL that
    cannot be completed. Consistent with a Webflow site that has been
    unpublished or whose custom-domain certificate was never renewed.
- observation: Internet Archive holds no capture of www.paperplane.ai after early 2025.
